# just-files as a CasaOS app: App Store -> Custom Install -> Import
# (docker-compose), then adjust the folder if needed. Plain Docker Compose
# works too (`docker compose up -d`); it ignores the x-casaos parts.
#
# It serves the server's whole filesystem, writable and as root, and the web
# UI has no login: anyone who can reach port 1341 can read, change and delete
# any file on the server, e.g. /etc/shadow or /etc/sudoers, which amounts to
# root access. Keep the port away from untrusted networks.
name: just-files
services:
  just-files:
    image: ghcr.io/vojty/just-files:latest
    container_name: just-files
    restart: unless-stopped
    ports:
      # Web UI on http://<server>:1341, next to just-dlna's 1340.
      - "1341:8080"
    environment:
      # just-files runs as this user and group: root, to reach every file.
      PUID: "0"
      PGID: "0"
      TZ: Europe/Prague
      # How often the search index rescans the folder for changes made
      # outside the web UI.
      SCAN_INTERVAL: 10m
    volumes:
      # The folder shown in the web UI: the server's whole filesystem. Add
      # `read_only: true` under this entry to only browse and download.
      - type: bind
        source: /
        target: /data
      # Settings changed in the web UI. Created by Docker if missing.
      - type: bind
        source: /DATA/AppData/just-files/config
        target: /config
        bind:
          create_host_path: true
      # The host's users and groups, so the Owner and Group columns show
      # names instead of numbers.
      - type: bind
        source: /etc/passwd
        target: /etc/passwd
        read_only: true
      - type: bind
        source: /etc/group
        target: /etc/group
        read_only: true
    x-casaos:
      envs:
        - container: PUID
          description:
            en_us: User ID just-files runs as (0 = root, to reach every file)
        - container: PGID
          description:
            en_us: Group ID just-files runs as
        - container: TZ
          description:
            en_us: Time zone
        - container: SCAN_INTERVAL
          description:
            en_us: How often search rescans the folder for outside changes, e.g. 10m
      volumes:
        - container: /data
          description:
            en_us: Folder browsed, searched and managed in the web UI (the whole server filesystem)
        - container: /config
          description:
            en_us: Settings saved by the web UI
        - container: /etc/passwd
          description:
            en_us: Host users, for the Owner column (read-only)
        - container: /etc/group
          description:
            en_us: Host groups, for the Group column (read-only)
      ports:
        - container: "8080"
          description:
            en_us: Web UI

x-casaos:
  architectures:
    - amd64
    - arm64
  main: just-files
  category: Utilities
  author: vojty
  developer: vojty
  title:
    en_us: just-files
  tagline:
    en_us: Web file browser with instant search and drag and drop uploads
  description:
    en_us: >-
      Browse a folder in a folder tree beside the file list, search all file
      names instantly, view images, video, audio, PDFs and highlighted code,
      and upload files and whole folders by drag and drop.
  index: /
  port_map: "1341"
  scheme: http
